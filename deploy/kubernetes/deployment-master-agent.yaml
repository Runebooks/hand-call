apiVersion: v1
kind: Service
metadata:
  name: master-agent
  namespace: a2a-ops
  labels:
    app.kubernetes.io/name: master-agent
    app.kubernetes.io/part-of: a2a-ops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: master-agent
  ports:
    - port: 8095
      targetPort: 8095
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-agent
  namespace: a2a-ops
  labels:
    app.kubernetes.io/name: master-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: master-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: master-agent
    spec:
      containers:
        - name: master
          image: python:3.11-slim-bookworm
          workingDir: /app
          command: ["/bin/bash", "-ec"]
          args:
            - |
              tar -xzf /src/agent-src.tar.gz -C /app
              pip install --no-cache-dir -q -r /app/requirements.txt
              exec python -m master.server
          ports:
            - containerPort: 8095
          envFrom:
            - secretRef:
                name: kubernetes-agent-llm
                optional: true
          env:
            - name: A2A_PORT
              value: "8095"
            - name: A2A_HOST
              value: "0.0.0.0"
            - name: AGENT_URLS
              value: "http://prometheus-agent.a2a-ops.svc.cluster.local:8080,http://rds-agent.a2a-ops.svc.cluster.local:8081,http://kubernetes-agent.a2a-ops.svc.cluster.local:8082"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: source
              mountPath: /src
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: source
          configMap:
            name: a2a-agents-source
