apiVersion: v1
kind: Service
metadata:
  name: freshservice-agent
  namespace: a2a-ops
  labels:
    app.kubernetes.io/name: freshservice-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: freshservice-agent
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshservice-agent
  namespace: a2a-ops
  labels:
    app.kubernetes.io/name: freshservice-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: freshservice-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freshservice-agent
    spec:
      containers:
        - name: agent
          image: python:3.11-slim-bookworm
          workingDir: /app
          command: ["/bin/bash", "-ec"]
          args:
            - |
              tar -xzf /src/agent-src.tar.gz -C /app
              pip install --no-cache-dir -q -r /app/requirements.txt
              exec python -m agents.freshservice.server
          ports:
            - containerPort: 8083
          envFrom:
            - secretRef:
                name: freshservice-agent-config
                optional: true
            - secretRef:
                name: kubernetes-agent-llm
                optional: true
          env:
            - name: A2A_PORT
              value: "8083"
            - name: A2A_HOST
              value: "0.0.0.0"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
            - name: FRESHSERVICE_AGENT_MODE
              value: "mcp"
            - name: FRESHSERVICE_MCP_MAX_STEPS
              value: "5"
            - name: FRESHSERVICE_FAST_PATH
              value: "true"
            - name: FRESHSERVICE_CACHE_ENABLED
              value: "true"
            - name: FRESHSERVICE_PG_CACHE_FIRST
              value: "true"
            - name: FRESHSERVICE_PIR_CACHE_TTL
              value: "3600"
            - name: FRESHSERVICE_FRESHSTATUS_CACHE_TTL
              value: "90"
            - name: LLM_READ_TIMEOUT
              value: "30"
            - name: LLM_ENABLED
              value: "true"
            - name: OPENAI_MAX_TOKENS
              value: "16000"
            - name: OPENAI_TEMPERATURE
              value: "0"
          volumeMounts:
            - name: source
              mountPath: /src
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 8
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
      volumes:
        - name: source
          configMap:
            name: a2a-agents-source
