apiVersion: v1
kind: Service
metadata:
  name: rds-agent
  namespace: a2a-ops
  labels:
    app.kubernetes.io/name: rds-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rds-agent
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-agent
  namespace: a2a-ops
  labels:
    app.kubernetes.io/name: rds-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rds-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rds-agent
    spec:
      containers:
        - name: agent
          image: python:3.11-slim-bookworm
          workingDir: /app
          command: ["/bin/bash", "-ec"]
          args:
            - |
              tar -xzf /src/agent-src.tar.gz -C /app
              pip install --no-cache-dir -q -r /app/requirements.txt
              exec python -m agents.rds.server
          ports:
            - containerPort: 8081
          env:
            - name: A2A_PORT
              value: "8081"
            - name: RDS_HOST
              value: ""
          volumeMounts:
            - name: source
              mountPath: /src
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
      volumes:
        - name: source
          configMap:
            name: a2a-agents-source
