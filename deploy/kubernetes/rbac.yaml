apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-agent
  namespace: a2a-ops
  labels:
    app.kubernetes.io/name: kubernetes-agent
    app.kubernetes.io/part-of: a2a-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: a2a-kubernetes-agent-reader
  labels:
    app.kubernetes.io/name: kubernetes-agent
    app.kubernetes.io/part-of: a2a-ops
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Staging mutations (K8S_MUTATIONS_ENABLED=true) — delete pods, patch deployments
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: a2a-kubernetes-agent-reader
  labels:
    app.kubernetes.io/name: kubernetes-agent
    app.kubernetes.io/part-of: a2a-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: a2a-kubernetes-agent-reader
subjects:
  - kind: ServiceAccount
    name: kubernetes-agent
    namespace: a2a-ops
