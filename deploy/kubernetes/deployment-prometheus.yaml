apiVersion: v1
kind: Service
metadata:
  name: prometheus-agent
  namespace: a2a-ops
  labels:
    app.kubernetes.io/name: prometheus-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus-agent
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-agent
  namespace: a2a-ops
  labels:
    app.kubernetes.io/name: prometheus-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-agent
    spec:
      containers:
        - name: agent
          image: python:3.11-slim-bookworm
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/bin/bash", "-ec"]
          args:
            - |
              tar -xzf /src/agent-src.tar.gz -C /app
              pip install --no-cache-dir -q -r /app/requirements.txt
              exec python -m agents.prometheus.server
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: prometheus-agent-config
                optional: true
            - secretRef:
                name: kubernetes-agent-llm
                optional: true
          env:
            - name: A2A_PORT
              value: "8080"
            - name: A2A_HOST
              value: "0.0.0.0"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PROMETHEUS_COMPACT_SLACK
              value: "true"
            - name: PROMETHEUS_LLM_PROMQL
              value: "true"
            - name: LLM_ENABLED
              value: "true"
            # Override via prometheus-agent-config secret (sync-prometheus-haystack-secret.sh)
            - name: PROMETHEUS_URL
              value: "http://vpce-0da3bda96a81ffc92-829begfe.vpce-svc-0680c3e2a8c08eb7c.us-east-1.vpce.amazonaws.com:10001/api/prom"
          volumeMounts:
            - name: source
              mountPath: /src
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
      volumes:
        - name: source
          configMap:
            name: a2a-agents-source
